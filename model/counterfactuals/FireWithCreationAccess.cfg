\* A schedule fires with the access its creator had when it was made:
\* intake schedules a root in a/, loses post, and it still sends.
\* expect: invariant FireAllowed
INIT Init
NEXT Next
VIEW View
CONSTANTS
  MaxMsgs = 3
  MaxScheds = 1
  MaxChanges = 1
  ReplyChecksBody = FALSE
  ReactWithoutRead = FALSE
  FireWithCreationAccess = TRUE
  ScopeUnion = FALSE
  EditByAnyone = FALSE
  PostNeedsRead = FALSE
  FireWaitsWhenRevoked = FALSE
INVARIANT FireAllowed
CHECK_DEADLOCK FALSE
