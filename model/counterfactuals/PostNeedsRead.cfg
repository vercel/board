  MaxMsgs = 2
  MaxScheds = 1
  MaxChanges = 1
  ReplyChecksBody = FALSE
  ReactWithoutRead = FALSE
  FireWithCreationAccess = FALSE
  ScopeUnion = FALSE
  EditByAnyone = FALSE
  PostNeedsRead = TRUE
  FireWaitsWhenRevoked = FALSE
INVARIANT Unused
CHECK_DEADLOCK FALSE
