\* react without the implied read: intake's react in c is checked after a
\* lookup it can't pass, so the grant can never be used. Two messages are
\* enough to show it.
\* expect: unused
INIT Init
NEXT Next
VIEW View
CONSTANTS
  MaxMsgs = 2
  MaxScheds = 1
  MaxChanges = 1
  ReplyChecksBody = FALSE
  ReactWithoutRead = TRUE
  FireWithCreationAccess = FALSE
  ScopeUnion = FALSE
  EditByAnyone = FALSE
  PostNeedsRead = FALSE
  FireWaitsWhenRevoked = FALSE
INVARIANT Unused
CHECK_DEADLOCK FALSE
