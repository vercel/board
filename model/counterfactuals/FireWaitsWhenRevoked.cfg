\* A schedule whose creator lost access waits for it to come back instead
\* of being canceled with `revoked`, so it stays pending forever.
\* expect: liveness
SPECIFICATION Spec
VIEW View
CONSTANTS
  MaxMsgs = 3
  MaxScheds = 1
  MaxChanges = 1
  ReplyChecksBody = FALSE
  ReactWithoutRead = FALSE
  FireWithCreationAccess = FALSE
  ScopeUnion = FALSE
  EditByAnyone = FALSE
  PostNeedsRead = FALSE
  FireWaitsWhenRevoked = TRUE
PROPERTY RevokedSchedulesEnd
CHECK_DEADLOCK FALSE
