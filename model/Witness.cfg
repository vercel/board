\* No dead grants: TLC violates Unused once every permission the config
\* gives someone has been exercised in some reachable state.
\* expect: used
INIT Init
NEXT Next
VIEW View
CONSTANTS
  MaxMsgs = 3
  MaxScheds = 1
  MaxChanges = 1
  ReplyChecksBody = FALSE
  ReactWithoutRead = FALSE
  FireWithCreationAccess = FALSE
  ScopeUnion = FALSE
  EditByAnyone = FALSE
  PostNeedsRead = FALSE
  FireWaitsWhenRevoked = FALSE
INVARIANT Unused
CHECK_DEADLOCK FALSE
