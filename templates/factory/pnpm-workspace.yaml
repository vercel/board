# This app is its own pnpm root, in its own repo and inside vercel-labs/board alike.
# pnpm holds back releases newer than a day; the versions this template pins are let through.
minimumReleaseAgeExclude:
  - '@vercel/board@0.49.0'
  - '@agent-browser/eve@0.41.2'
  - '@agent-browser/sandbox@0.41.2'

ignoredOptionalDependencies:
  - "@mongodb-js/zstd"
  - "node-liblzma"
