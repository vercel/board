# `pnpm check` (build + typecheck + test) on every PR and on main. Its job,
# `check`, is the status that branch protection requires before a PR can land.
name: check

on:
  pull_request:
  push:
    # pi/** too: Pi's PRs are opened by pi-pr as github-actions[bot], and a run for a PR a bot opened waits for
    # someone to approve it, so the push's run is the one that reports `check` on the PR's head.
    branches: [main, "pi/**"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # TLC on the TLA+ model of per-channel access (model/README.md). Its own job,
  # so it reports separately and branch protection doesn't require it.
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: model/check.sh
