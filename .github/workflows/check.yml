# `pnpm check` (build + typecheck + test) on every PR and on main. Its job,
# `check`, is the status that branch protection requires before a PR can land.
name: check

on:
  pull_request:
  push:
    # board/** too: a run for a PR a bot opened can wait for someone to approve it, so the push's run
    # is the one that reports `check` on a factory PR's head.
    branches: [main, "board/**"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
