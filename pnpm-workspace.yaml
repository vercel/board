packages:
  - packages/*
  - apps/*
# esbuild (via vitest) only checks its platform binary at install; the tests run without it.
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - '@vercel/board@0.32.0'
  - '@vercel/board@0.49.0'

ignoredOptionalDependencies:
  - "@mongodb-js/zstd"
  - "node-liblzma"
